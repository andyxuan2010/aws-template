name: Publish documentation portal

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.MD"
      - "**/*.pdf"
      - "**/*.vsdx"
      - "**/*.svg"
      - "**/*.webp"
      - "index.html"
      - "docs-manifest.json"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
      - "scripts/Generate-DocsManifest.ps1"
  workflow_dispatch:
  repository_dispatch:
    types:
      - stage-snapshot

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  documentation-portal-gate:
    name: Documentation Portal Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_origin: ${{ steps.gate.outputs.is_origin }}
    steps:
      - name: Evaluate IS_ORIGIN
        id: gate
        shell: bash
        env:
          IS_ORIGIN: ${{ vars.IS_ORIGIN }}
        run: |
          set -euo pipefail

          if [[ "${IS_ORIGIN,,}" == "true" ]]; then
            echo "is_origin=true" >> "${GITHUB_OUTPUT}"
            echo "Documentation portal deployment is skipped for the origin repository."
          else
            echo "is_origin=false" >> "${GITHUB_OUTPUT}"
            echo "Documentation portal deployment runs for the mirror repository."
          fi
  deploy:
    needs: documentation-portal-gate
    name: Publish AWS documentation portal
    if: needs['documentation-portal-gate'].outputs.is_origin == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Generate documentation manifest
        shell: pwsh
        run: ./scripts/Generate-DocsManifest.ps1

      - name: Stage documentation portal
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir _site

          # Copy portal documents and their supported assets into the published site.
          git ls-files -z | while IFS= read -r -d '' file; do
            case "${file}" in
              .github/*) continue ;;
              *.md | *.MD | *.pdf | *.vsdx | *.png | *.svg | *.webp | index.html | docs-manifest.json | .nojekyll) ;;
              *) continue ;;
            esac
            mkdir -p "_site/$(dirname "${file}")"
            cp "${file}" "_site/${file}"
          done

      - name: Report skipped deployment for private repository
        if: github.event.repository.visibility != 'public'
        shell: bash
        run: |
          echo "::warning title=GitHub Pages deployment skipped::Repository is private; GitHub Pages configuration and deployment were skipped."
          echo "GitHub Pages deployment was skipped because the repository is private." >> "${GITHUB_STEP_SUMMARY}"

      - name: Configure GitHub Pages
        if: github.event.repository.visibility == 'public'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        if: github.event.repository.visibility == 'public'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy
        if: github.event.repository.visibility == 'public'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
