name: Terraform

on:
  push:
    branches:
      - main
      - dev
      - sbx
    paths-ignore:
      - "**/*.pdf"
      - "**/*.vsdx"
  pull_request:
    branches:
      - main
      - dev
      - sbx
    paths-ignore:
      - "**/*.pdf"
      - "**/*.vsdx"
  workflow_dispatch:
  repository_dispatch:
    types:
      - stage-snapshot

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TERRAFORM_VERSION: 1.15.8

jobs:
  terraform-gate:
    name: Terraform Workflow Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Evaluate IS_ORIGIN
        id: gate
        shell: bash
        env:
          IS_ORIGIN: ${{ vars.IS_ORIGIN }}
        run: |
          set -euo pipefail

          if [[ "${IS_ORIGIN,,}" == "true" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Terraform workflow is enabled for the origin repository."
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Terraform workflow is disabled; downstream Terraform jobs will be skipped."
          fi
  workflow-lint:
    name: Lint GitHub Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12

  static-validation:
    needs: terraform-gate
    if: needs['terraform-gate'].outputs.enabled == 'true'
    name: Static IaC and Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan IaC and repository secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          timeout: 10m

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6
        with:
          tflint_version: v0.59.1

      - name: Initialize TFLint plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive --format compact

  check-required-secrets-variables:
    needs: terraform-gate
    if: needs['terraform-gate'].outputs.enabled == 'true'
    name: Check Required Secrets and Variables
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_stage_publish_inputs: ${{ steps.preflight.outputs.has_stage_publish_inputs }}
      has_ado_dev_publish_inputs: ${{ steps.preflight.outputs.has_ado_dev_publish_inputs }}
      has_ado_prod_publish_inputs: ${{ steps.preflight.outputs.has_ado_prod_publish_inputs }}
      is_stage_repository: ${{ steps.preflight.outputs.is_stage_repository }}
    steps:
      - name: Evaluate optional publication inputs
        id: preflight
        shell: bash
        env:
          STAGE_REPOSITORY: ${{ vars.STAGE_REPOSITORY }}
          STAGE_REPO_TOKEN_PRESENT: ${{ secrets.STAGE_REPO_TOKEN != '' }}
          ADO_DEV_REPOSITORY: ${{ vars.ADO_DEV_REPOSITORY }}
          ADO_DEV_REPO_PAT_PRESENT: ${{ secrets.ADO_DEV_REPO_PAT != '' }}
          PUBLISH_ADO_PROD: ${{ vars.PUBLISH_ADO_PROD }}
          ADO_PROD_REPOSITORY: ${{ vars.ADO_PROD_REPOSITORY }}
          ADO_PROD_REPO_PAT_PRESENT: ${{ secrets.ADO_PROD_REPO_PAT != '' }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # STAGE_REPOSITORY is an env var; the lowercase copy below is an intentional reassignment.
          # shellcheck disable=SC2153
          stage_repository="${STAGE_REPOSITORY#https://github.com/}"
          stage_repository="${stage_repository%.git}"
          stage_repository="${stage_repository#/}"
          stage_repository="${stage_repository%/}"

          if [[ -n "${stage_repository}" && "${CURRENT_REPOSITORY,,}" == "${stage_repository,,}" ]]; then
            echo "is_stage_repository=true" >> "${GITHUB_OUTPUT}"
            echo "Current repository matches STAGE_REPOSITORY; stage publication will be skipped to prevent a loop."
          else
            echo "is_stage_repository=false" >> "${GITHUB_OUTPUT}"
          fi

          if [[ -n "${stage_repository}" && "${STAGE_REPO_TOKEN_PRESENT}" == "true" ]]; then
            echo "has_stage_publish_inputs=true" >> "${GITHUB_OUTPUT}"
            echo "GitHub stage repository publication inputs are present."
          else
            echo "has_stage_publish_inputs=false" >> "${GITHUB_OUTPUT}"
            echo "GitHub stage repository publication inputs are incomplete; publication will be skipped."
          fi

          if [[ -n "${ADO_DEV_REPOSITORY}" && "${ADO_DEV_REPO_PAT_PRESENT}" == "true" ]]; then
            echo "has_ado_dev_publish_inputs=true" >> "${GITHUB_OUTPUT}"
            echo "Azure DevOps development publication inputs are present."
          else
            echo "has_ado_dev_publish_inputs=false" >> "${GITHUB_OUTPUT}"
            echo "Azure DevOps development publication inputs are incomplete; publication will be skipped."
          fi

          report_input() {
            local input_type="$1"
            local input_name="$2"
            local input_value="$3"

            if [[ -n "${input_value}" ]]; then
              echo "- ${input_type} ${input_name}: present"
            else
              echo "- ${input_type} ${input_name}: missing"
            fi
          }

          echo ""
          echo "Publish ADO Production/Sandbox Repo requires:"
          report_input "variable" "PUBLISH_ADO_PROD" "${PUBLISH_ADO_PROD}"
          report_input "variable" "ADO_PROD_REPOSITORY" "${ADO_PROD_REPOSITORY}"
          if [[ "${ADO_PROD_REPO_PAT_PRESENT}" == "true" ]]; then
            report_input "secret" "ADO_PROD_REPO_PAT" "present"
          else
            report_input "secret" "ADO_PROD_REPO_PAT" ""
          fi

          if [[ "${PUBLISH_ADO_PROD}" == "true" && -n "${ADO_PROD_REPOSITORY}" && "${ADO_PROD_REPO_PAT_PRESENT}" == "true" ]]; then
            echo "has_ado_prod_publish_inputs=true" >> "${GITHUB_OUTPUT}"
            echo "Azure DevOps production/sandbox publication inputs are present."
          else
            echo "has_ado_prod_publish_inputs=false" >> "${GITHUB_OUTPUT}"
            echo "ADO production/sandbox publishing is disabled, or a required variable/secret is missing; publication will be skipped."
          fi

  detect-module-targets:
    name: Detect Module Harness Targets
    needs:
      - terraform-gate
      - check-required-secrets-variables
    if: needs['terraform-gate'].outputs.enabled == 'true' && (needs.check-required-secrets-variables.outputs.is_stage_repository != 'true' || github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_modules: ${{ steps.detect.outputs.has_modules }}
      module_matrix: ${{ steps.detect.outputs.module_matrix }}
      module_list: ${{ steps.detect.outputs.module_list }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed module targets
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          mapfile -t all_modules < <(find modules -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          if [[ "${#all_modules[@]}" -eq 0 ]]; then
            echo "No modules found under modules/." >&2
            exit 1
          fi
          for module in "${all_modules[@]}"; do
            if [[ ! "${module}" =~ ^[a-z][a-z0-9_]*$ ]]; then
              echo "Invalid module directory name '${module}'; use lowercase letters, digits, and underscores, starting with a letter." >&2
              exit 1
            fi
          done
          all_modules_json="$(printf '%s\n' "${all_modules[@]}" | jq -R . | jq -sc .)"
          base_ref=""
          head_ref="${PUSH_HEAD_SHA}"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_ref="${PR_BASE_SHA}"
            head_ref="${PR_HEAD_SHA}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            base_ref="${PUSH_BEFORE_SHA}"
          else
            echo "Workflow dispatch has no stable diff base; selecting all modules."
            {
              echo "has_modules=true"
              echo "module_matrix={\"module\":${all_modules_json}}"
              echo "module_list=${all_modules_json}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ -z "${base_ref}" || "${base_ref}" =~ ^0+$ ]]; then
            changed_files=""
            run_all=true
          elif ! git cat-file -e "${base_ref}^{commit}" 2>/dev/null || ! git cat-file -e "${head_ref}^{commit}" 2>/dev/null; then
            echo "Unable to resolve the push diff base or head (${base_ref}..${head_ref}); selecting all modules."
            changed_files=""
            run_all=true
          else
            if changed_files="$(git diff --name-only "${base_ref}" "${head_ref}")"; then
              run_all=false
            else
              echo "Unable to calculate the push diff (${base_ref}..${head_ref}); selecting all modules."
              changed_files=""
              run_all=true
            fi
          fi

          declare -A selected=()
          while IFS= read -r changed_file; do
            [[ -z "${changed_file}" ]] && continue
            if [[ "${changed_file}" =~ ^modules/([^/]+)(/|$) ]]; then
              module_name="${BASH_REMATCH[1]}"
              if [[ -d "modules/${module_name}" ]]; then
                selected["${module_name}"]=1
              else
                run_all=true
              fi
            elif [[ "${changed_file}" =~ ^(examples/|scripts/|[^/]+\.tf$|\.tflint\.hcl$|\.terraform-docs\.yml$) ]]; then
              run_all=true
            fi
          done <<< "${changed_files}"

          if [[ "${run_all}" == "true" ]]; then
            module_list_json="${all_modules_json}"
          elif [[ "${#selected[@]}" -eq 0 ]]; then
            module_list_json="[]"
          else
            module_list_json="$(printf '%s\n' "${!selected[@]}" | sort | jq -R . | jq -sc .)"
          fi

          if [[ "${module_list_json}" == "[]" ]]; then
            has_modules=false
          else
            has_modules=true
          fi

          {
            echo "has_modules=${has_modules}"
            echo "module_matrix={\"module\":${module_list_json}}"
            echo "module_list=${module_list_json}"
          } >> "${GITHUB_OUTPUT}"
          echo "Selected module harness targets: ${module_list_json}"

  validate-modules:
    name: Validate Module (${{ matrix.module }})
    needs:
      - terraform-gate
      - check-required-secrets-variables
      - detect-module-targets
    if: needs['terraform-gate'].outputs.enabled == 'true' && (needs.detect-module-targets.outputs.has_modules == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        module: ${{ fromJson(needs.detect-module-targets.outputs.module_matrix).module }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Create provider cache
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR}"

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ env.TERRAFORM_VERSION }}-${{ hashFiles('**/*.tf') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-${{ env.TERRAFORM_VERSION }}-
            terraform-providers-${{ runner.os }}-

      - name: Terraform init without backend
        uses: ./.github/actions/terraform-init-no-backend
        with:
          working-directory: modules/${{ matrix.module }}

      - name: Terraform validate
        working-directory: modules/${{ matrix.module }}
        run: terraform validate -no-color

      - name: Terraform test
        working-directory: modules/${{ matrix.module }}
        run: terraform test -no-color

  validate-plan:
    if: needs['terraform-gate'].outputs.enabled == 'true'
    name: Validate and Plan
    needs:
      - terraform-gate
      - check-required-secrets-variables
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ci-placeholder
      AWS_SECRET_ACCESS_KEY: ci-placeholder
      AWS_EC2_METADATA_DISABLED: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Create provider cache
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR}"

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ env.TERRAFORM_VERSION }}-${{ hashFiles('**/*.tf') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-${{ env.TERRAFORM_VERSION }}-
            terraform-providers-${{ runner.os }}-

      - name: Terraform init without backend
        uses: ./.github/actions/terraform-init-no-backend
        with:
          working-directory: examples/foundation

      - name: Terraform validate
        working-directory: examples/foundation
        run: terraform validate -no-color

      - name: Terraform plan without backend or AWS API access
        working-directory: examples/foundation
        run: >-
          terraform plan
          -input=false
          -no-color
          -lock=false
          -refresh=false
          -var='offline_plan=true'
          -var='bucket_name=ccoecicheck-foundation-placeholder'

  publish-stage-repo:
    name: Publish Github Demo Repo
    if: needs['terraform-gate'].outputs.enabled == 'true' && (always() && github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/main","refs/heads/dev","refs/heads/sbx"]'), github.ref) && needs.check-required-secrets-variables.outputs.is_stage_repository != 'true' && needs.check-required-secrets-variables.outputs.has_stage_publish_inputs == 'true' && needs.static-validation.result == 'success' && needs.validate-plan.result == 'success' && (needs.validate-modules.result == 'success' || needs.validate-modules.result == 'skipped') && (needs.create-git-tag.result == 'success' || needs.create-git-tag.result == 'skipped'))
    needs:
      - terraform-gate
      - check-required-secrets-variables
      - static-validation
      - validate-modules
      - validate-plan
      - create-git-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Publish clean snapshot to stage repository
        env:
          STAGE_REPOSITORY: ${{ vars.STAGE_REPOSITORY }}
          STAGE_REPO_TOKEN: ${{ secrets.STAGE_REPO_TOKEN }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${STAGE_REPO_TOKEN}" ]]; then
            echo "Missing required secret: STAGE_REPO_TOKEN" >&2
            exit 1
          fi

          # STAGE_REPOSITORY is an env var; the lowercase copy below is an intentional reassignment.
          # shellcheck disable=SC2153
          stage_repository="${STAGE_REPOSITORY#https://github.com/}"
          stage_repository="${stage_repository%.git}"
          stage_repository="${stage_repository#/}"
          stage_repository="${stage_repository%/}"

          if [[ -z "${stage_repository}" ]]; then
            echo "Missing required repository variable: STAGE_REPOSITORY" >&2
            exit 1
          fi

          if [[ "${CURRENT_REPOSITORY,,}" == "${stage_repository,,}" ]]; then
            echo "STAGE_REPOSITORY must be different from the source repository." >&2
            exit 1
          fi

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT

          rsync -a \
            --exclude='.git' \
            "${GITHUB_WORKSPACE}/" "${workdir}/repo/"

          cd "${workdir}/repo"

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${SOURCE_BRANCH}"
          git add .
          git commit -m "Stage snapshot from ${SOURCE_BRANCH}@${SOURCE_SHA}"

          target_repo="https://github.com/${stage_repository}.git"
          git remote add origin "${target_repo}"

          askpass_path="${workdir}/git-askpass.sh"
          cat > "${askpass_path}" <<'ASKPASS'
          #!/usr/bin/env bash
          prompt="${1:-}"
          if [[ "${prompt}" == *Username* && "${prompt}" == *"${GIT_HTTP_HOST}"* ]]; then
            printf '%s\n' "${GIT_HTTP_USERNAME}"
          elif [[ "${prompt}" == *Password* && "${prompt}" == *"${GIT_HTTP_HOST}"* ]]; then
            printf '%s\n' "${GIT_HTTP_PASSWORD}"
          else
            exit 1
          fi
          ASKPASS
          chmod 700 "${askpass_path}"
          export GIT_ASKPASS="${askpass_path}"
          export GIT_TERMINAL_PROMPT=0
          export GIT_HTTP_HOST="github.com"
          export GIT_HTTP_USERNAME="x-access-token"
          export GIT_HTTP_PASSWORD="${STAGE_REPO_TOKEN}"
          git push --force origin "${SOURCE_BRANCH}"
          unset GIT_ASKPASS GIT_HTTP_HOST GIT_HTTP_USERNAME GIT_HTTP_PASSWORD

          # Dispatch stage-snapshot so the stage repo's pages.yml deploys the published snapshot
          GH_TOKEN="${STAGE_REPO_TOKEN}" gh api \
            --method POST \
            "repos/${stage_repository}/dispatches" \
            --field event_type=stage-snapshot          

  create-git-tag:
    name: Create Git Tag
    if: needs['terraform-gate'].outputs.enabled == 'true' && (always() && vars.ENABLE_GITHUB_RELEASE_TAG == 'true' && github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/main","refs/heads/dev","refs/heads/sbx"]'), github.ref) && needs.check-required-secrets-variables.outputs.is_stage_repository != 'true' && needs.static-validation.result == 'success' && needs.validate-plan.result == 'success' && (needs.validate-modules.result == 'success' || needs.validate-modules.result == 'skipped'))
    needs:
      - terraform-gate
      - check-required-secrets-variables
      - static-validation
      - validate-plan
      - validate-modules
    outputs:
      release_tag: ${{ steps.semver.outputs.release_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: canonical-release-tags
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create canonical GitHub release tag
        id: semver
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force --tags origin

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -z "${latest_tag}" ]]; then
            latest_tag="v1.0.0"
          fi

          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "${version}"
          release_tag="v${major}.${minor}.$((patch + 1))"
          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Tag ${release_tag} already exists on origin."
          else
            git tag -a "${release_tag}" "${SOURCE_SHA}" -m "Release ${release_tag} from ${SOURCE_BRANCH}@${SOURCE_SHA}"
            git push origin "refs/tags/${release_tag}"
          fi

          {
            echo "release_tag=${release_tag}"
          } >> "${GITHUB_OUTPUT}"

  publish-ado-dev-repo:
    name: Publish ADO Dev Repo
    if: always() && needs.terraform-gate.outputs.enabled == 'true' && needs.static-validation.result == 'success' && github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/main","refs/heads/dev","refs/heads/sbx"]'), github.ref) && needs['check-required-secrets-variables'].outputs.is_stage_repository != 'true' && needs['check-required-secrets-variables'].outputs.has_ado_dev_publish_inputs == 'true' && needs.validate-plan.result == 'success' && (needs.create-git-tag.result == 'success' || needs.create-git-tag.result == 'skipped') && (needs.validate-modules.result == 'success' || needs.validate-modules.result == 'skipped')
    needs:
      - terraform-gate
      - static-validation
      - check-required-secrets-variables
      - validate-plan
      - validate-modules
      - create-git-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'dev' && 'dev' || github.ref_name == 'sbx' && 'sbx' || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publish Git history to Azure DevOps development repo
        env:
          ADO_DEV_REPOSITORY: ${{ vars.ADO_DEV_REPOSITORY }}
          ADO_DEV_REPO_PAT: ${{ secrets.ADO_DEV_REPO_PAT }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          RELEASE_TAG: ${{ needs.create-git-tag.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ADO_DEV_REPO_PAT}" ]]; then
            echo "Missing required secret: ADO_DEV_REPO_PAT" >&2
            exit 1
          fi

          if [[ -z "${ADO_DEV_REPOSITORY}" ]]; then
            echo "Missing required repository variable: ADO_DEV_REPOSITORY" >&2
            exit 1
          fi

          cd "${GITHUB_WORKSPACE}"
          git fetch --force --tags origin

          target_repo="https://dev.azure.com/${ADO_DEV_REPOSITORY}"
          git remote remove ado-dev 2>/dev/null || true
          git remote add ado-dev "${target_repo}"

          askpass_path="$(mktemp)"
          trap 'rm -f "${askpass_path}"' EXIT
          cat > "${askpass_path}" <<'ASKPASS'
          #!/usr/bin/env bash
          prompt="${1:-}"
          if [[ "${prompt}" == *Username* && "${prompt}" == *"${GIT_HTTP_HOST}"* ]]; then
            printf '%s\n' "${GIT_HTTP_USERNAME}"
          elif [[ "${prompt}" == *Password* && "${prompt}" == *"${GIT_HTTP_HOST}"* ]]; then
            printf '%s\n' "${GIT_HTTP_PASSWORD}"
          else
            exit 1
          fi
          ASKPASS
          chmod 700 "${askpass_path}"
          export GIT_ASKPASS="${askpass_path}"
          export GIT_TERMINAL_PROMPT=0
          export GIT_HTTP_HOST="dev.azure.com"
          export GIT_HTTP_USERNAME="ado"
          export GIT_HTTP_PASSWORD="${ADO_DEV_REPO_PAT}"

          git checkout "${SOURCE_BRANCH}"
          git push --force ado-dev "refs/heads/${SOURCE_BRANCH}:refs/heads/${SOURCE_BRANCH}"

          if [[ -n "${RELEASE_TAG}" ]]; then
            origin_tag_ref="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
            if [[ -z "${origin_tag_ref}" ]]; then
              echo "GitHub tag ${RELEASE_TAG} was not found on origin." >&2
              exit 1
            fi

            git tag -d "${RELEASE_TAG}" >/dev/null 2>&1 || true
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            git push --force ado-dev "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          fi
          unset GIT_ASKPASS GIT_HTTP_HOST GIT_HTTP_USERNAME GIT_HTTP_PASSWORD

  publish-ado-production-repo:
    name: Publish ADO Production/Sandbox Repo
    if: always() && needs.terraform-gate.outputs.enabled == 'true' && needs.static-validation.result == 'success' && github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/main","refs/heads/dev","refs/heads/sbx"]'), github.ref) && needs['check-required-secrets-variables'].outputs.is_stage_repository != 'true' && needs['check-required-secrets-variables'].outputs.has_ado_prod_publish_inputs == 'true' && needs.validate-plan.result == 'success' && (needs.create-git-tag.result == 'success' || needs.create-git-tag.result == 'skipped') && (needs.validate-modules.result == 'success' || needs.validate-modules.result == 'skipped')
    needs:
      - terraform-gate
      - static-validation
      - check-required-secrets-variables
      - validate-plan
      - validate-modules
      - create-git-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publish Git history to Azure DevOps production+sandbox repo
        env:
          ADO_PROD_REPOSITORY: ${{ vars.ADO_PROD_REPOSITORY }}
          ADO_PROD_REPO_PAT: ${{ secrets.ADO_PROD_REPO_PAT }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.create-git-tag.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ADO_PROD_REPO_PAT}" ]]; then
            echo "Missing required secret: ADO_PROD_REPO_PAT" >&2
            exit 1
          fi

          if [[ -z "${ADO_PROD_REPOSITORY}" ]]; then
            echo "Missing required repository variable: ADO_PROD_REPOSITORY" >&2
            exit 1
          fi

          cd "${GITHUB_WORKSPACE}"

          git fetch --force --tags origin

          target_repo="https://dev.azure.com/${ADO_PROD_REPOSITORY}"
          git remote remove ado-prod 2>/dev/null || true
          git remote add ado-prod "${target_repo}"

          askpass_path="$(mktemp)"
          trap 'rm -f "${askpass_path}"' EXIT
          cat > "${askpass_path}" <<'ASKPASS'
          #!/usr/bin/env bash
          prompt="${1:-}"
          if [[ "${prompt}" == *Username* && "${prompt}" == *"${GIT_HTTP_HOST}"* ]]; then
            printf '%s\n' "${GIT_HTTP_USERNAME}"
          elif [[ "${prompt}" == *Password* && "${prompt}" == *"${GIT_HTTP_HOST}"* ]]; then
            printf '%s\n' "${GIT_HTTP_PASSWORD}"
          else
            exit 1
          fi
          ASKPASS
          chmod 700 "${askpass_path}"
          export GIT_ASKPASS="${askpass_path}"
          export GIT_TERMINAL_PROMPT=0
          export GIT_HTTP_HOST="dev.azure.com"
          export GIT_HTTP_USERNAME="ado"
          export GIT_HTTP_PASSWORD="${ADO_PROD_REPO_PAT}"

          git checkout "${SOURCE_BRANCH}"
          git push --force ado-prod "refs/heads/${SOURCE_BRANCH}:refs/heads/${SOURCE_BRANCH}"

          if [[ -n "${RELEASE_TAG}" ]]; then
            origin_tag_ref="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
            if [[ -z "${origin_tag_ref}" ]]; then
              echo "GitHub tag ${RELEASE_TAG} was not found on origin." >&2
              exit 1
            fi

            git tag -d "${RELEASE_TAG}" >/dev/null 2>&1 || true
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            git push --force ado-prod "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          fi
          unset GIT_ASKPASS GIT_HTTP_HOST GIT_HTTP_USERNAME GIT_HTTP_PASSWORD
