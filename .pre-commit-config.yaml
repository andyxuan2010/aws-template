exclude: \.pdf$

repos:
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check -recursive
        language: system
        pass_filenames: false
        files: \.tf$

      - id: terraform-validate-modules
        name: terraform validate modules
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Test-TerraformModules.ps1
        language: system
        pass_filenames: false
        files: \.(tf|tftest\.hcl)$
